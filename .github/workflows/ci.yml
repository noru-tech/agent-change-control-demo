# Tests for the synthetic service, shell checks, and the offline preview: every scenario's
# expected outcome in scenarios.yml evaluated against the pinned acc release, without GitHub data.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm test
      - name: Shell scripts
        run: |
          bash -n scripts/*.sh
          shellcheck -x -S warning scripts/*.sh

  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install acc
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-acc.sh "$RUNNER_TEMP/acc" >> "$GITHUB_PATH"
      - run: scripts/preview.sh --table
