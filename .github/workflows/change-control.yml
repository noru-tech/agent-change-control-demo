# The check every scenario pull request shows. It runs acc on the pull request with the evidence
# the demo publishes (agent account mappings, Agent Trace records, verified signed bundles), fails
# when the policy threshold is exceeded, and uploads SARIF to code scanning. The ruleset on main
# requires this job, so failing scenarios cannot be merged.
#
# Runs on review events as well as pushes: a verdict changes the moment an approval arrives, goes
# stale or is dismissed.
#
# The checkout is the base commit, never the pull request: the policy and the scripts come from
# main, so a pull request cannot change the rules it is checked against. Evidence on the pull
# request's head (Agent Trace records) is read through the API as data.
name: change-control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: change-control-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  change-control:
    name: change-control
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Gather evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          dir="$RUNNER_TEMP/acc-inputs"
          scripts/acc-inputs.sh "$PR" "$dir"
          {
            echo "agent-account<<ACC_EOF"; cat "$dir/agent-accounts.txt"; echo "ACC_EOF"
            echo "agent-vendor<<ACC_EOF"; cat "$dir/agent-vendors.txt"; echo "ACC_EOF"
            if [ -d "$dir/traces" ]; then echo "agent-trace=$dir/traces"; else echo "agent-trace="; fi
            echo "verification<<ACC_EOF"; ls "$dir"/verification/*.json 2>/dev/null || true; echo "ACC_EOF"
            echo "verified-by=$(cat "$dir/verified-by.txt" 2>/dev/null || true)"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate the pull request
        id: acc
        uses: noru-tech/agent-change-control@0c140ee047e6c7b5b16d09d3ee59ec12b4a854bc # v0.6.0
        with:
          version: "0.6.0"
          agent-account: ${{ steps.evidence.outputs.agent-account }}
          agent-vendor: ${{ steps.evidence.outputs.agent-vendor }}
          agent-trace: ${{ steps.evidence.outputs.agent-trace }}
          verification: ${{ steps.evidence.outputs.verification }}
          verified-by: ${{ steps.evidence.outputs.verified-by }}
          fail-on-findings: true

      - name: Upload SARIF to code scanning
        if: always() && steps.acc.outputs.output != '' && !github.event.pull_request.head.repo.fork
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.acc.outputs.output }}
          category: agent-change-control
